server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "${12345678910}"
    sources:
      youtube: false   # el soporte de YouTube ahora va por el plugin de abajo, no el built-in
      soundcloud: true
      bandcamp: true
      twitch: true
      http: true
      local: false
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.11.4"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth es más estable que cookies de navegador exportadas a mano (no
    # expiran igual, y es el método que recomienda el propio plugin).
    # La primera vez que arranque, va a imprimir en los logs un link y un
    # código para vincular una cuenta de Google — hay que hacerlo una sola vez.
    oauth:
      enabled: true

logging:
  level:
    root: INFO
    lavalink: INFO
